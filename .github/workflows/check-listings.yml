# Validates the listings on every edit, then regenerates the category pages
# and commits them. That means you can edit data/listings.js in the GitHub web
# editor and the sixteen category pages, sitemap and homepage links all update
# themselves — no local tooling needed.
name: Check listings

on:
  push:
    branches: [main]
    paths:
      - "data/listings.js"
      - "js/script.js"
      - "index.html"
      - "tools/check-listings.js"
      - "tools/build.js"
  pull_request:
    paths:
      - "data/listings.js"
      - "js/script.js"
      - "index.html"
      - "tools/check-listings.js"
      - "tools/build.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check the site scripts parse
        run: |
          node --check js/script.js
          node --check data/listings.js
          node --check tools/build.js

      - name: Check every listing is usable
        run: node tools/check-listings.js

      # Only rebuild on main. On a pull request the checks above are the point,
      # and committing generated files back to a PR branch is surprising.
      - name: Rebuild category pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node tools/build.js

      - name: Commit any regenerated pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Category pages already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # skip ci stops this commit retriggering the workflow.
          git commit -m "Rebuild category pages from listings [skip ci]"
          git push
