<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Catch-Up Paradox</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}
</style>
</head>
<body>
<canvas id="c" width="720" height="1280"></canvas>
<script>
/* The Catch-Up Paradox. 720x1280, 46s, deterministic: window.renderAt(t). ?rec = 1:1 canvas for render.js.
   You stand on the step equal to your age. Parent is 30 steps ahead; your child is born when you are 30.
   Stylised lifespan: 84. */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=720,H=1280,CX=360,DUR=46,GAP=30,LIFE=84,DISS=2;
const REC=new URLSearchParams(location.search).has('rec');
const THUMB=new URLSearchParams(location.search).has('thumb');
const FONT='"Inter","Helvetica Neue",Helvetica,Arial,sans-serif';
let Z=1;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=x=>{x=cl(x);return x*x*(3-2*x)};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sprite(sz,stops){const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d');
  const g=x.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);stops.forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,sz,sz);return c}
const glow=sprite(64,[[0,'rgba(255,244,214,1)'],[.16,'rgba(255,226,165,.8)'],[.5,'rgba(222,172,92,.18)'],[1,'rgba(200,150,70,0)']]);
const dot=(x,y,r,a)=>{ctx.globalAlpha=Math.max(0,a);ctx.drawImage(glow,x-r,y-r,2*r,2*r)};
function text(str,x,y,size,weight,color,alpha,align='center',ls=0){
  if(alpha<=.003)return;
  ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';
  ctx.font=`${weight} ${size/Z}px ${FONT}`;ctx.letterSpacing=(ls/Z)+'px';ctx.fillText(str,x,y);ctx.letterSpacing='0px';
}
function fitText(str,x,y,width,weight,color,alpha,ls=0,maxSize=34){
  const save=Z;Z=1;ctx.font=`${weight} 20px ${FONT}`;ctx.letterSpacing=ls+'px';const w=ctx.measureText(str).width;ctx.letterSpacing='0px';
  const k=Math.min(width/w,maxSize/20);text(str,x,y,20*k,weight,color,alpha,'center',ls*k);Z=save;
}

/* ---------- timeline: Y = your age as the clock ---------- */
const YKF=[[0,0],[3.5,0],[8.5,10],[12,20],[15,30],[18.5,42],[21.5,54],[24.5,56],[27.5,66],[30,76],[31.8,84],[33.2,86],[35.5,100],[37.5,114],[38.5,115],[40,130],[42,150],[46,152]];
function Yat(t){
  if(t<=0)return 0;
  for(let i=0;i<YKF.length-1;i++){const[t0,y0]=YKF[i],[t1,y1]=YKF[i+1];if(t<t1)return y0+(y1-y0)*(t-t0)/(t1-t0)}
  return 152;
}
function tAtY(y){let lo=3.5,hi=46;for(let i=0;i<40;i++){const m=(lo+hi)/2;Yat(m)<y?lo=m:hi=m}return hi}
const CAPS=[
 [.3,3.8,'YOUR PARENT IS','30 YEARS AHEAD OF YOU.'],
 [4.0,8.2,'THE GAP NEVER CHANGES.','ALWAYS 30 STEPS.'],
 [8.5,13,'BUT THE RATIO DOES.','10 IS ONLY A QUARTER OF 40.'],
 [13.2,17.8,'AT 30, YOU ARE HALF','THEIR AGE. (30 / 60)'],
 [18,21.3,'KEEP CLIMBING AND YOU GET CLOSER...','BUT NEVER REACH 100%.'],
 [21.6,24.4,'UNTIL THE STEPS ABOVE YOU','GO EMPTY.'],
 [24.6,29.5,'NOW YOU ARE THE ONE AHEAD.','THE RATIO RESETS. THE GAP IS 30 AGAIN.'],
 [29.8,34.8,'THEN YOUR CHILD IS THE ONE AHEAD.','AND THEIR CHILD CLIMBS BEHIND.'],
 [35.2,39,'THE STAIRS NEVER EMPTY.','ONLY THE CLIMBERS CHANGE.'],
 [39.5,46.5,'YOU NEVER CATCH UP.','YOU BECOME THE ONE AHEAD.']
];

/* ---------- stairs geometry ---------- */
const DX=5.8,DY=5.1,X0=86,Y0=862;
const SX=s=>X0+DX*s, SY=s=>Y0-DY*s;
function stairPath(a,b){ctx.beginPath();ctx.moveTo(SX(a),SY(a));for(let i=Math.floor(a);i<b;i++){ctx.lineTo(SX(i+1),SY(i));ctx.lineTo(SX(i+1),SY(i+1))}}
const NAMES={'-1':'PARENT','0':'YOU','1':'YOUR CHILD','2':'GRANDCHILD'};

function pos(s){return[SX(s)+DX/2,SY(s)-5]}
const SPARK=[...Array(4*28)].map(()=>({a:Math.random?0:0}));
{const r=mulberry(77);for(let i=0;i<SPARK.length;i++)SPARK[i]={ang:r()*6.28,sp:20+r()*60,sz:3+r()*6,dl:r()*.4}}

function drawScene(t,Y){
  ctx.globalCompositeOperation='lighter';
  // stairs
  ctx.strokeStyle='rgb(222,176,100)';ctx.lineJoin='miter';
  const seg=[[0,60,.5],[60,84,.38],[84,96,.22],[96,106,.1],[106,116,.04]];
  for(const[a,b,al]of seg){stairPath(a,b);ctx.globalAlpha=al*.3;ctx.lineWidth=4;ctx.stroke();ctx.globalAlpha=al;ctx.lineWidth=1.2;ctx.stroke()}
  // age ticks every 10 steps
  for(let s=10;s<=90;s+=10){ctx.globalAlpha=.1;ctx.fillStyle='#fff';ctx.fillRect(40,SY(s),SX(s)-40,1)}
  // lifetime star at step 84 (grows with each departure)
  let deaths=0;
  const gens=[-1,0,1,2,3,4,5];
  const live=[];
  for(const j of gens){
    const age=Y-GAP*j; if(age<0)continue;
    if(age>=LIFE+DISS){deaths++;continue}
    live.push({j,age});
  }
  dot(SX(LIFE)+DX/2,SY(LIFE)-5,16+7*deaths,.10+.10*deaths);
  // births (rings)
  for(let j=1;j<=5;j++){const tb=tAtY(GAP*j),u=(t-tb)/1.8;if(u>0&&u<1){const[x,y]=pos(0);ctx.globalAlpha=(1-u)*.6;ctx.strokeStyle='rgb(255,236,190)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,6+60*sm(u),0,Math.PI*2);ctx.stroke();dot(x,y,40*(1-u)+12,(1-u))}}
  // threads between each parent and child
  for(const c of live){
    const p=live.find(q=>q.j===c.j-1); if(!p)continue;
    const dyn=p.age>LIFE?1-sm((p.age-LIFE)/DISS):1;
    const a=cl(c.age/2)*dyn;
    const[x0,y0]=pos(Math.min(c.age,LIFE)),[x1,y1]=pos(Math.min(p.age,LIFE));
    const mx=(x0+x1)/2,my=(y0+y1)/2,dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy)||1;
    const cx=mx-dy/len*len*.28,cy=my+dx/len*len*.28; // bow to the upper-left
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.quadraticCurveTo(cx,cy,x1,y1);
    ctx.strokeStyle='rgb(255,226,170)';
    ctx.globalAlpha=a*.16;ctx.lineWidth=6;ctx.stroke();ctx.globalAlpha=a*.7;ctx.lineWidth=1.4;ctx.stroke();
  }
  // climbers
  for(const c of live){
    const s=Math.min(c.age,LIFE), dying=c.age>LIFE?sm((c.age-LIFE)/DISS):0, fa=1-dying;
    const[x,y]=pos(s);
    // trail
    stairPath(0,s);ctx.strokeStyle='rgb(255,232,180)';ctx.globalAlpha=.30*fa;ctx.lineWidth=1.6;ctx.stroke();
    const isYou=c.j===0, r=isYou?9:7;
    const born=cl(c.age/1.2);
    dot(x,y,r*4.2*(1+dying*.8),(isYou?.75:.55)*fa*born);dot(x,y,r*1.3,fa*born);
    if(isYou){ctx.globalAlpha=.5*fa;ctx.strokeStyle='rgb(255,244,214)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,r*1.9,0,Math.PI*2);ctx.stroke()}
    if(dying>0){ // dissolve into light that drifts up the stairs
      for(let k=0;k<28;k++){const sp=SPARK[(Math.floor(c.j+1)%4)*28+k];const u=cl(dying*1.2-sp.dl);
        const px=x+Math.cos(sp.ang)*sp.sp*u*.6+DX*u*18,py=y+Math.sin(sp.ang)*sp.sp*u*.6-DY*u*18;
        dot(px,py,sp.sz*(1-u*.5)+4,(1-u)*.8)}
    }
  }
  ctx.globalCompositeOperation='source-over';
  // labels (scene text, counter-scaled)
  for(const c of live){
    const nm=NAMES[c.j];if(!nm)continue;
    const dying=c.age>LIFE?sm((c.age-LIFE)/DISS):0, s=Math.min(c.age,LIFE), [x,y]=pos(s);
    const born=sm((c.age-.5)/1.2);
    const low=s<12;
    text(nm,low?x+14:x-18,low?y+24:y+5,c.j===0?16:14,700,c.j===0?'#fff':'#e8cf9a',(1-dying)*born*.95,low?'left':'right',3);
  }
  // gap label for the pair that is "ahead / behind" (focus pair)
  const m=Y<54?0:Math.floor((Y-54)/30)+1, childJ=m, parJ=m-1;
  const ca=Y-GAP*childJ, pa=Y-GAP*parJ;
  if(ca>=0&&pa<LIFE+.5){
    const[x0,y0]=pos(ca),[x1,y1]=pos(Math.min(pa,LIFE));
    const sw=m===0?0:54+30*(m-1), al=sm((Y-sw)/1.5)*(ca>1?1:0);
    const mx=(x0+x1)/2,my=(y0+y1)/2;
    text(GAP+' STEPS',mx+22,my+4,14,700,'#f0d9a8',al*.9,'left',2);
  }
  return {m,ca,pa};
}

/* ---------- ratio graph ---------- */
function drawGraph(t,Y,m,ca,pa){
  const gx0=86,gx1=650,gy0=1040,gy1=930,AX=90;
  const X=a=>gx0+(gx1-gx0)*a/AX, Yg=p=>gy0-(gy0-gy1)*p, R=a=>a/(a+GAP);
  text('YOUR AGE AS A SHARE OF THEIR AGE',CX,904,13,600,'#a9a9a9',.9,'center',4);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.12;ctx.fillStyle='#fff';
  for(const p of[0,.5])ctx.fillRect(gx0,Yg(p),gx1-gx0,1);
  for(let a=0;a<=90;a+=30){ctx.fillRect(X(a),gy1,1,gy0-gy1);text(String(a),X(a),1060,12,500,'#8e8e8e',.9)}
  text('CHILD AGE',CX,1082,12,600,'#8e8e8e',.8,'center',3);
  text('0%',gx0-10,Yg(0)+4,12,500,'#8e8e8e',.9,'right');text('50%',gx0-10,Yg(.5)+4,12,500,'#8e8e8e',.9,'right');text('100%',gx0-10,Yg(1)+4,12,500,'#8e8e8e',.9,'right');
  // 100% line that is never reached
  ctx.globalAlpha=.5;ctx.strokeStyle='rgb(255,236,190)';ctx.lineWidth=1;ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(gx0,Yg(1));ctx.lineTo(gx1,Yg(1));ctx.stroke();ctx.setLineDash([]);
  text('NEVER REACHED',gx1,Yg(1)-8,12,700,'#f0d9a8',.9,'right',2);
  ctx.globalCompositeOperation='lighter';
  // ghost curve
  ctx.beginPath();for(let a=0;a<=AX;a+=1)a?ctx.lineTo(X(a),Yg(R(a))):ctx.moveTo(X(a),Yg(a));
  ctx.strokeStyle='rgb(255,226,170)';ctx.globalAlpha=.22;ctx.lineWidth=1.5;ctx.stroke();
  // live part (the same curve every cycle)
  const a=Math.max(0,Math.min(ca,AX));
  ctx.beginPath();for(let k=0;k<=a;k+=.5)k?ctx.lineTo(X(k),Yg(R(k))):ctx.moveTo(X(k),Yg(0));ctx.lineTo(X(a),Yg(R(a)));
  ctx.globalAlpha=.2;ctx.lineWidth=6;ctx.stroke();ctx.globalAlpha=.95;ctx.lineWidth=2;ctx.stroke();
  dot(X(a),Yg(R(a)),16,.95);
  ctx.globalCompositeOperation='source-over';
  const al=sm((t-15)/1);text('AGE 30 = 50%',X(30)+6,Yg(.5)-10,12,700,'#f4dcaa',al*.9,'left');
}

/* ---------- frame ---------- */
function renderAt(t){
  t=((t%DUR)+DUR)%DUR;
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const Y=Yat(t);
  const z=1+1.6*Math.pow(1-sm(t/15),1.3), fx=SX(0)+DX/2, fy=SY(0);
  Z=z;ctx.save();ctx.translate(fx,fy);ctx.scale(z,z);ctx.translate(-fx,-fy);
  const {m,ca,pa}=drawScene(t,Y);
  ctx.restore();Z=1;
  drawGraph(t,Y,m,ca,pa);
  text('THE CATCH-UP PARADOX',CX,100,15,600,'#a9a9a9',1,'center',5);
  const cAge=Math.max(0,Math.floor(ca)),pAge=Math.min(LIFE,Math.floor(pa)),ratio=pa>0?Math.max(0,ca)/pa:0;
  const cols=[[120,'CHILD AGE',String(cAge)],[360,'PARENT AGE',String(pAge)],[600,'RATIO',(ratio*100).toFixed(1)+'%']];
  for(const[x,l,v]of cols){text(l,x,150,13,600,'#8e8e8e',1,'center',4);text(v,x,198,46,700,'#fff',1,'center',0)}
  for(const[t0,t1,l1,l2]of CAPS){
    const al=sm((t-t0)/.4)*(t1>=46?1:1-sm((t-(t1-.4))/.4));
    if(al>0){fitText(l1,CX,262,640,700,'#fff',al,0,34);fitText(l2,CX,302,640,700,'#f0d9a8',al,0,34)}
  }
  ctx.globalAlpha=1;
}
window.renderAt=renderAt;window.DUR=DUR;window.tAtY=tAtY;
function fit(){if(REC){cv.style.width=W+'px';cv.style.height=H+'px';return}const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const qt=new URLSearchParams(location.search).get('t');
if(qt!==null||REC){renderAt(+qt||0)}
else{let t0=performance.now();addEventListener('click',()=>t0=performance.now());(function loop(now){renderAt((now-t0)/1000);requestAnimationFrame(loop)})(t0)}
</script>
</body>
</html>
