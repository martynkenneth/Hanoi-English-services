<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Birthday Paradox</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}
</style>
</head>
<body>
<canvas id="c" width="720" height="1280"></canvas>
<script>
/* The Birthday Paradox. 720x1280, 44s, deterministic: window.renderAt(t). ?rec = 1:1 canvas for render.js. */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=720,H=1280,CX=360,CY=600,RAD=220,DUR=44;
const REC=new URLSearchParams(location.search).has('rec');
const FONT='"Inter","Helvetica Neue",Helvetica,Arial,sans-serif';
let Z=1;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=x=>{x=cl(x);return x*x*(3-2*x)};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sprite(sz,stops){const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d');
  const g=x.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);stops.forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,sz,sz);return c}
const glow=sprite(64,[[0,'rgba(255,244,214,1)'],[.16,'rgba(255,226,165,.8)'],[.5,'rgba(222,172,92,.18)'],[1,'rgba(200,150,70,0)']]);
const dot=(x,y,r,a)=>{ctx.globalAlpha=a;ctx.drawImage(glow,x-r,y-r,2*r,2*r)};
function text(str,x,y,size,weight,color,alpha,align='center',ls=0){
  if(alpha<=.003)return;
  ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';
  ctx.font=`${weight} ${size/Z}px ${FONT}`;ctx.letterSpacing=(ls/Z)+'px';ctx.fillText(str,x,y);ctx.letterSpacing='0px';
}
function fitText(str,x,y,width,weight,color,alpha,ls=0,maxSize=34){
  const save=Z;Z=1;ctx.font=`${weight} 20px ${FONT}`;ctx.letterSpacing=ls+'px';const w=ctx.measureText(str).width;ctx.letterSpacing='0px';
  const k=Math.min(width/w,maxSize/20);text(str,x,y,20*k,weight,color,alpha,'center',ls*k);Z=save;
}

/* ---------- maths ---------- */
const PROB=[0];{let q=1;for(let n=1;n<=80;n++){q*=(365-(n-1))/365;PROB[n]=1-q}}
const probAt=n=>{const a=Math.floor(n),f=n-a;return PROB[a]+(PROB[Math.min(80,a+1)]-PROB[a])*f};

/* ---------- a fixed sample group where person 23 is the first to match ---------- */
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],ML=[31,28,31,30,31,30,31,31,30,31,30,31];
const dayStr=d=>{let m=0;while(d>=ML[m]){d-=ML[m];m++}return MON[m]+' '+(d+1)};
let BD,MATCH;
for(let seed=1;;seed++){
  const r=mulberry(seed);BD=Array.from({length:70},()=>Math.floor(r()*365));
  const seen=new Map();let hit=-1,partner=-1;
  for(let i=0;i<70;i++){if(seen.has(BD[i])){hit=i;partner=seen.get(BD[i]);break}seen.set(BD[i],i)}
  if(hit===22){MATCH=[partner,22];break}
}

/* ---------- timeline ---------- */
const NKF=[[0,1],[3.2,1],[4.2,2],[6.6,3],[7.6,4],[8.5,5],[9.3,6],[10,8],[10.8,10],[13.2,15],[16.2,20],[18.4,22],[19.4,23],[23.4,23],[27,35],[30,50],[33,62],[35.8,70]];
function nAt(t){
  if(t<=0)return 1;
  for(let i=0;i<NKF.length-1;i++){const[t0,n0]=NKF[i],[t1,n1]=NKF[i+1];if(t<t1)return n0+(n1-n0)*(t-t0)/(t1-t0)}
  return 70;
}
const CAPS=[
 [.3,3.5,'HOW MANY PEOPLE DOES IT TAKE','FOR TWO TO SHARE A BIRTHDAY?'],
 [3.7,6.2,'MOST PEOPLE GUESS ABOUT 183.','(HALF OF 365 DAYS)'],
 [6.6,11.5,'BUT EACH NEW PERSON MEETS','EVERYONE ALREADY HERE.'],
 [11.8,17,'PAIRS GROW FASTER THAN PEOPLE.','EVERY PAIR IS A CHANCE TO MATCH.'],
 [17.3,19.2,'AT 23 PEOPLE...','THERE ARE 253 PAIRS.'],
 [19.5,23.4,'PERSON 23 SHARES A BIRTHDAY','WITH PERSON '+(MATCH[0]+1)+'.'],
 [23.6,27.5,'A COIN FLIP,','AT ONLY 23 PEOPLE.'],
 [27.8,33.5,'41 PEOPLE: 90% LIKELY.','57 PEOPLE: 99% LIKELY.'],
 [33.8,36.5,'70 PEOPLE: 99.9%.','ALMOST CERTAIN.'],
 [37,44.5,'YOUR BRAIN COUNTS PEOPLE.','THE MATH COUNTS PAIRS.']
];
const MILES=[[19.4,23],[28.2,41],[31.75,57],[35.8,70]];

/* ---------- scene ---------- */
function drawScene(t,n){
  const ni=Math.floor(n+1e-6),fr=n-ni,cnt=Math.ceil(n-1e-6);
  const Nlay=Math.max(n,2);
  const pos=i=>{const a=-Math.PI/2+2*Math.PI*i/Nlay;return[CX+RAD*Math.cos(a),CY+RAD*Math.sin(a),a]};
  const pairs=ni*(ni-1)/2;
  ctx.globalCompositeOperation='lighter';
  // faint ring
  ctx.globalAlpha=.10;ctx.strokeStyle='rgb(222,176,100)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(CX,CY,RAD,0,Math.PI*2);ctx.stroke();
  // chords
  const a=cl(2.2/Math.pow(Math.max(n,2),.85),.06,.9);
  const P=[];for(let i=0;i<cnt;i++)P.push(pos(i));
  ctx.strokeStyle='rgb(255,226,170)';
  const draw=(newOnly)=>{
    ctx.beginPath();
    for(let j=1;j<cnt;j++){
      const isNew=(j===cnt-1&&fr>1e-6);
      if(newOnly!==isNew)continue;
      for(let i=0;i<j;i++){
        const[x0,y0]=P[i],[x1,y1]=P[j];
        if(isNew){ctx.moveTo(x1,y1);ctx.lineTo(x1+(x0-x1)*fr,y1+(y0-y1)*fr)}
        else{ctx.moveTo(x0,y0);ctx.lineTo(x1,y1)}
      }
    }
  };
  draw(false);
  if(n<=32){ctx.globalAlpha=a*.25;ctx.lineWidth=3;ctx.stroke()}
  ctx.globalAlpha=a;ctx.lineWidth=1;ctx.stroke();
  draw(true);ctx.globalAlpha=Math.min(1,a*1.6);ctx.lineWidth=1.3;ctx.stroke();
  // matching pair highlight
  const hm=sm((t-19.2)/.4)*(1-sm((t-24.5)/.8));
  if(hm>0&&cnt>MATCH[1]){
    const[x0,y0]=P[MATCH[0]],[x1,y1]=P[MATCH[1]];
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);
    ctx.strokeStyle='rgb(255,250,236)';
    ctx.globalAlpha=hm*.25;ctx.lineWidth=9;ctx.stroke();
    ctx.globalAlpha=hm;ctx.lineWidth=2.4;ctx.stroke();
    const pul=.75+.25*Math.sin(t*9);
    for(const[x,y]of[[x0,y0],[x1,y1]]){dot(x,y,46,hm*pul);}
  }
  // milestone rings
  for(const[tm]of MILES){
    const u=(t-tm)/1.6;if(u<=0||u>=1)continue;
    ctx.globalAlpha=(1-u)*.55;ctx.strokeStyle='rgb(255,236,190)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(CX,CY,RAD*(.15+1.1*sm(u)),0,Math.PI*2);ctx.stroke();
  }
  // nodes
  const r=cl(7-n*.06,2.4,6);
  for(let i=0;i<cnt;i++){
    const[x,y]=P[i], fa=(i===cnt-1&&fr>1e-6)?fr:1;
    const tw=n>40?.8+.2*Math.sin(t*3+i*1.7):1;
    dot(x,y,r*3.6,.55*fa*tw);dot(x,y,r*1.2,fa);
  }
  ctx.globalCompositeOperation='source-over';
  // YOU label
  { const[x,y]=P[0]; text('YOU',x,y-50,15,700,'#fff',.95,'center',4); }
  // birthday labels (fade out after the match)
  const la=1-sm((n-26)/4)*1;
  if(la>0.01&&n<=31){
    ctx.globalCompositeOperation='source-over';
    for(let i=0;i<cnt;i++){
      const[x,y,ang]=P[i],fa=(i===cnt-1&&fr>1e-6)?fr:1;
      const isM=(hm>0&&(i===MATCH[0]||i===MATCH[1]));
      const rr=RAD+(isM?36:26), lx=CX+rr*Math.cos(ang), ly=CY+rr*Math.sin(ang);
      const al=la*fa;
      if(isM)text(dayStr(BD[i]),lx,ly+5,17,800,'#fff',hm,'center',1);
      text(dayStr(BD[i]),lx,ly+5,12,600,'#d9b878',al*(isM?(1-hm):.8),'center',1);
    }
  }
  return {ni,pairs};
}

/* ---------- graph ---------- */
function drawGraph(t,n){
  const gx0=86,gx1=650,gy0=1040,gy1=900;               // y: 0% at gy0, 100% at gy1
  const X=k=>gx0+(gx1-gx0)*k/70, Y=p=>gy0-(gy0-gy1)*p;
  ctx.globalCompositeOperation='source-over';
  text('CHANCE OF A SHARED BIRTHDAY',CX,872,13,600,'#a9a9a9',.9,'center',4);
  ctx.globalAlpha=.12;ctx.fillStyle='#fff';
  for(const p of[0,.5,1])ctx.fillRect(gx0,Y(p),gx1-gx0,1);
  for(let k=0;k<=70;k+=10){ctx.fillRect(X(k),gy1,1,gy0-gy1);text(String(k),X(k),1062,12,500,'#8e8e8e',.9)}
  text('0%',gx0-10,Y(0)+4,12,500,'#8e8e8e',.9,'right');text('50%',gx0-10,Y(.5)+4,12,500,'#8e8e8e',.9,'right');text('100%',gx0-10,Y(1)+4,12,500,'#8e8e8e',.9,'right');
  text('PEOPLE',CX,1084,12,600,'#8e8e8e',.8,'center',3);
  // curve
  ctx.globalCompositeOperation='lighter';
  const nn=Math.min(n,70), last=Math.floor(nn);
  ctx.beginPath();ctx.moveTo(X(0),Y(0));
  for(let k=1;k<=last;k++)ctx.lineTo(X(k),Y(PROB[k]));
  if(nn>last)ctx.lineTo(X(nn),Y(probAt(nn)));
  ctx.strokeStyle='rgb(255,226,170)';
  ctx.globalAlpha=.2;ctx.lineWidth=6;ctx.stroke();ctx.globalAlpha=.95;ctx.lineWidth=2;ctx.stroke();
  // area
  ctx.lineTo(X(nn),Y(0));ctx.lineTo(X(0),Y(0));ctx.closePath();
  const g=ctx.createLinearGradient(0,gy1,0,gy0);g.addColorStop(0,'rgba(222,172,92,.22)');g.addColorStop(1,'rgba(222,172,92,0)');
  ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fill();
  dot(X(nn),Y(probAt(nn)),16,.9);
  ctx.globalCompositeOperation='source-over';
  // callouts
  const call=(k,lab,after)=>{const al=sm((n-k+.2)/1.2);if(al<=0)return;
    ctx.globalCompositeOperation='lighter';dot(X(k),Y(PROB[k]),11,al);ctx.globalCompositeOperation='source-over';
    text(lab,X(k)+(after||0),Y(PROB[k])+(after?-2:26),13,700,'#f4dcaa',al,after?'left':'center')};
  call(23,'50.7%');call(41,'90%');call(57,'99%');
  const al70=sm((n-69.2)/.8); if(al70>0)text('99.9%',X(70)-4,Y(PROB[70])-14,13,700,'#fff',al70,'right');
  // the common guess
  const ga=sm((t-3.7)/.6)*.7;
  text('YOUR GUESS: 183  ▸',gx1,1110,12,600,'#d9b878',ga,'right',2);
}

/* ---------- frame ---------- */
function renderAt(t){
  t=((t%DUR)+DUR)%DUR;
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const n=nAt(t);
  // camera: start tight on YOU (top of the ring), pull back
  const z=1+1.25*Math.pow(1-sm(t/9),1.3);
  Z=z;ctx.save();ctx.translate(CX,CY-RAD);ctx.scale(z,z);ctx.translate(-CX,-(CY-RAD));
  const {ni,pairs}=drawScene(t,n);
  ctx.restore();Z=1;
  drawGraph(t,n);
  // header + stats
  text('THE BIRTHDAY PARADOX',CX,100,15,600,'#a9a9a9',1,'center',5);
  const cols=[[120,'PEOPLE',String(ni)],[360,'PAIRS',pairs.toLocaleString('en-US')],[600,'CHANCE',(probAt(Math.min(n,70))*100).toFixed(1)+'%']];
  for(const[x,l,v]of cols){text(l,x,150,13,600,'#8e8e8e',1,'center',4);text(v,x,198,46,700,'#fff',1,'center',0)}
  // captions
  for(const[t0,t1,l1,l2]of CAPS){
    const al=sm((t-t0)/.4)*(t1>=44?1:1-sm((t-(t1-.4))/.4));
    if(al>0){fitText(l1,CX,262,640,700,'#fff',al,0,34);fitText(l2,CX,302,640,700,'#f0d9a8',al,0,34)}
  }
  ctx.globalAlpha=1;
}
window.renderAt=renderAt;window.DUR=DUR;
function fit(){if(REC){cv.style.width=W+'px';cv.style.height=H+'px';return}const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const qt=new URLSearchParams(location.search).get('t');
if(qt!==null||REC){renderAt(+qt||0)}
else{let t0=performance.now();addEventListener('click',()=>t0=performance.now());(function loop(now){renderAt((now-t0)/1000);requestAnimationFrame(loop)})(t0)}
</script>
</body>
</html>
